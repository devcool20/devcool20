<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100">
  <defs>
    <filter id="drsGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="exhaustFlame" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2a1f" stop-opacity="1" />
      <stop offset="35%" stop-color="#E10600" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#E10600" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Card -->
  <rect x="2" y="2" width="896" height="96" rx="14" fill="#0d1117" stroke="#161b22" stroke-width="1" />

  <!-- Asphalt Track Perimeter -->
  <rect x="10" y="10" width="880" height="80" rx="10" fill="none" stroke="#161b22" stroke-width="8" />
  <rect x="10" y="10" width="880" height="80" rx="10" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="6 6" />

  <!-- Inner Telemetry Copy -->
  <text x="36" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" fill="#f0f6fc">
    divyanshu sharma <tspan fill="#8b949e" font-weight="400" font-size="13">// @devcool20</tspan>
  </text>
  <text x="36" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#8b949e">
    product builder · open source (clawvisor yc p26, paradedb, openwork, mem0) · 40+ merged prs
  </text>

  <!-- Live Status Pill -->
  <g transform="translate(730, 36)">
    <rect x="0" y="0" width="132" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="17" cy="14" r="4" fill="#E10600">
      <animate attributeName="opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="29" y="18" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c9d1d9" font-weight="600">
      drs: enabled
    </text>
  </g>

  <!-- TOP-DOWN F1 CAR + ATTACHED TRAILING SLIPSTREAM (ALWAYS ALIGNED) -->
  <g>
    <animateMotion dur="7.5s" repeatCount="indefinite" rotate="auto" path="M 20,10 L 880,10 A 10,10 0 0 1 890,20 L 890,80 A 10,10 0 0 1 880,90 L 20,90 A 10,10 0 0 1 10,80 L 10,20 A 10,10 0 0 1 20,10 Z" />

    <!-- Slipstream Trail Strictly Behind Rear Wing (x < -14) -->
    <rect x="-95" y="-1.5" width="82" height="3" rx="1.5" fill="url(#exhaustFlame)" filter="url(#drsGlow)" />

    <!-- Carbon Rear Wing -->
    <rect x="-15" y="-6.5" width="3.2" height="13" rx="0.8" fill="#161b22" stroke="#E10600" stroke-width="0.9" />

    <!-- Rear Pirelli Tires (with Soft Yellow Sidewall Dot) -->
    <rect x="-10.5" y="-7.5" width="5.5" height="3" rx="1" fill="#090b0e" stroke="#30363d" stroke-width="0.5" />
    <rect x="-10.5" y="4.5" width="5.5" height="3" rx="1" fill="#090b0e" stroke="#30363d" stroke-width="0.5" />
    <line x1="-9" y1="-6" x2="-6.5" y2="-6" stroke="#facc15" stroke-width="0.7" />
    <line x1="-9" y1="6" x2="-6.5" y2="6" stroke="#facc15" stroke-width="0.7" />

    <!-- Carbon Floor / Diffuser -->
    <rect x="-11" y="-4" width="16" height="8" rx="1.5" fill="#161b22" />

    <!-- Sculpted F1 Sidepods & Engine Cover (Ferrari Scarlet) -->
    <path d="M -12,-2.2 L -6,-4.8 L 2,-4.5 L 6,-2 L 15,-0.9 L 15,0.9 L 6,2 L 2,4.5 L -6,4.8 L -12,2.2 Z" fill="#E10600" />

    <!-- Cockpit & Halo -->
    <ellipse cx="-1.5" cy="0" rx="3.5" ry="1.8" fill="#0d1117" />
    <circle cx="-2" cy="0" r="1.2" fill="#facc15" />
    <path d="M -1.5,-1.6 L 2,0 L -1.5,1.6" fill="none" stroke="#21262d" stroke-width="0.9" />

    <!-- Front Suspension Arms -->
    <line x1="6" y1="-1.5" x2="9" y2="-5.5" stroke="#484f58" stroke-width="0.8" />
    <line x1="6" y1="1.5" x2="9" y2="5.5" stroke="#484f58" stroke-width="0.8" />

    <!-- Front Pirelli Tires -->
    <rect x="6.5" y="-7" width="4.8" height="2.6" rx="0.9" fill="#090b0e" stroke="#30363d" stroke-width="0.5" />
    <rect x="6.5" y="4.4" width="4.8" height="2.6" rx="0.9" fill="#090b0e" stroke="#30363d" stroke-width="0.5" />
    <line x1="7.8" y1="-5.7" x2="10" y2="-5.7" stroke="#facc15" stroke-width="0.6" />
    <line x1="7.8" y1="5.7" x2="10" y2="5.7" stroke="#facc15" stroke-width="0.6" />

    <!-- Swept Carbon Front Wing (Dark Carbon + Scarlet Endplates, NO White Bar!) -->
    <path d="M 13,-6.5 L 15.5,-5.5 L 15.5,5.5 L 13,6.5 L 13.8,0 Z" fill="#161b22" stroke="#E10600" stroke-width="0.8" />
    <!-- Nose Tip -->
    <path d="M 11,-1.2 L 16.5,-0.5 L 16.5,0.5 L 11,1.2 Z" fill="#E10600" />
  </g>
</svg>
